name: Deploy Sample

# Deploys the src/sample app (a second web application) via the reusable deploy.yml,
# proving the framework is reusable end-to-end (openspec change: sample-ci-deploy).
#
# GATED OFF by default: the deploy/build jobs run only when the repo Variable
# SAMPLE_DEPLOY_ENABLED == 'true'. Flip it on AFTER the sample's AWS prerequisites exist
# (bootstrap stack named `sample-appcloud-systems` per region, DNS/ACM for
# sample.appcloud.systems, a sample `dev` for feature branches to import). See
# src/sample/DEPLOYING.md. Until enabled, pushes touching src/sample are a no-op here,
# so this workflow cannot break dev/app CI.
#
# Naming: domain-name = sample.appcloud.systems (dashed `sample-appcloud-systems`) gives the
# sample its OWN bootstrap/KMS/ECR/SSM/Aurora namespace, distinct from TaskManager's
# `appcloud-systems` — the only isolation axis, since the reusable stack derives names from
# the domain (no ProjectName). DNS records live in the existing appcloud.systems hosted zone.
on:
  push:
    branches:
      - '**'
    paths:
      - 'src/sample/**'
      - '.github/workflows/sample-deploy.yml'
    tags-ignore:
      - '**'
  workflow_dispatch:

concurrency:
  group: sample-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/app' }}

jobs:
  get-branch-name:
    name: Get Branch Name
    runs-on: ubuntu-latest
    outputs:
      branch-name: ${{ steps.get-branch.outputs.branch-name }}
      environment: ${{ steps.get-branch.outputs.environment }}
      enabled: ${{ vars.SAMPLE_DEPLOY_ENABLED }}
    steps:
      - id: get-branch
        run: |
          LEAF=${GITHUB_REF#refs/heads/}; LEAF=${LEAF##*/}
          case "$LEAF" in
            app) ENV=Production ;;
            test) ENV=Staging ;;
            *) ENV=Development ;;
          esac
          echo "branch-name=$LEAF" >> "$GITHUB_OUTPUT"
          echo "environment=$ENV" >> "$GITHUB_OUTPUT"
          if [ "${{ vars.SAMPLE_DEPLOY_ENABLED }}" != "true" ]; then
            echo "::notice::Sample deploy is gated off (set repo Variable SAMPLE_DEPLOY_ENABLED=true after provisioning the sample's AWS prerequisites — see src/sample/DEPLOYING.md)."
          fi

  build-sample:
    name: Build & Test Sample
    runs-on: ubuntu-latest
    needs: [get-branch-name]
    if: needs.get-branch-name.outputs.enabled == 'true'
    permissions:
      contents: read
      packages: read
    outputs:
      custom-version: ${{ steps.version.outputs.custom-version }}
    env:
      # Restores the framework packages (Tjb.Web.Framework / Hosting / Framework.Data) from
      # GitHub Packages; src/sample/nuget.config expands %GH_PACKAGES_TOKEN%.
      GH_PACKAGES_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - id: version
        run: echo "custom-version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: Restore + build + test Sample.sln
        run: |
          dotnet restore src/sample/Sample.sln
          dotnet build src/sample/Sample.sln -c Release --no-restore
          # No unit-test project in the sample today; UI tests run post-deploy via deploy.yml.

  deploy:
    name: Deploy Sample to AWS
    needs: [build-sample, get-branch-name]
    if: needs.get-branch-name.outputs.enabled == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      branch-name: ${{ needs.get-branch-name.outputs.branch-name }}
      environment: ${{ needs.get-branch-name.outputs.environment }}
      custom-version: ${{ needs.build-sample.outputs.custom-version }}
      domain-name: sample.appcloud.systems
      hosted-zone-id: Z06422172SASV44F5Y8VA
      region-primary: ${{ vars.AWS_REGION_PRIMARY }}
      region-secondary: ${{ vars.AWS_REGION_SECONDARY }}
      web-dockerfile-path: src/sample/Sample.Web/Dockerfile
      web-image-name: sample-web
      ui-tests-project-path: src/sample/Sample.UiTests
    secrets: inherit
