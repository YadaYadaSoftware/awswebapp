name: Deploy Sample

# Deploys the src/sample app (a second web application) via the reusable deploy.yml,
# proving the framework is reusable end-to-end (openspec change: sample-ci-deploy).
#
# GATED OFF by default: the deploy/build jobs run only when the repo Variable
# SAMPLE_DEPLOY_ENABLED == 'true'. Flip it on AFTER the sample's AWS prerequisites exist
# (bootstrap stack named `sample-appcloud-systems` per region, DNS/ACM for
# sample.appcloud.systems, a sample `dev` for feature branches to import). See
# src/sample/DEPLOYING.md. Until enabled, pushes touching src/sample are a no-op here,
# so this workflow cannot break dev/app CI.
#
# Naming: domain-name = sample.appcloud.systems (dashed `sample-appcloud-systems`) gives the
# sample its OWN bootstrap/KMS/ECR/SSM/Aurora namespace, distinct from TaskManager's
# `appcloud-systems` — the only isolation axis, since the reusable stack derives names from
# the domain (no ProjectName). DNS records live in the existing appcloud.systems hosted zone.
on:
  push:
    branches:
      - '**'
    paths:
      - 'src/sample/**'
      - '.github/workflows/sample-deploy.yml'
    tags-ignore:
      - '**'
  workflow_dispatch:

concurrency:
  group: sample-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/app' }}

jobs:
  get-branch-name:
    name: Get Branch Name
    runs-on: ubuntu-latest
    outputs:
      branch-name: ${{ steps.get-branch.outputs.branch-name }}
      environment: ${{ steps.get-branch.outputs.environment }}
      enabled: ${{ vars.SAMPLE_DEPLOY_ENABLED }}
    steps:
      - id: get-branch
        run: |
          LEAF=${GITHUB_REF#refs/heads/}; LEAF=${LEAF##*/}
          case "$LEAF" in
            app) ENV=Production ;;
            test) ENV=Staging ;;
            *) ENV=Development ;;
          esac
          echo "branch-name=$LEAF" >> "$GITHUB_OUTPUT"
          echo "environment=$ENV" >> "$GITHUB_OUTPUT"
          if [ "${{ vars.SAMPLE_DEPLOY_ENABLED }}" != "true" ]; then
            echo "::notice::Sample deploy is gated off (set repo Variable SAMPLE_DEPLOY_ENABLED=true after provisioning the sample's AWS prerequisites — see src/sample/DEPLOYING.md)."
          fi

  validate-config:
    name: Validate configuration
    runs-on: ubuntu-latest
    needs: [get-branch-name]
    if: needs.get-branch-name.outputs.enabled == 'true'
    env:
      # Secrets can't be enumerated by name, so receive them via env and check emptiness.
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      FRAMEWORK_FEED_TOKEN: ${{ secrets.FRAMEWORK_FEED_TOKEN }}
      AWS_ACCESS_KEY_ID_PROD: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
      AWS_SECRET_ACCESS_KEY_PROD: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
      GOOGLE_TEST_ACCESS_TOKEN: ${{ secrets.GOOGLE_TEST_ACCESS_TOKEN }}
      GOOGLE_TEST_REFRESH_TOKEN: ${{ secrets.GOOGLE_TEST_REFRESH_TOKEN }}
      VAR_DOMAIN_NAME: ${{ vars.DOMAIN_NAME }}
      VAR_AWS_REGION_PRIMARY: ${{ vars.AWS_REGION_PRIMARY }}
      VAR_AWS_REGION_SECONDARY: ${{ vars.AWS_REGION_SECONDARY }}
      VAR_HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
    steps:
      - name: Check required variables and secrets
        run: |
          missing=()
          [ -z "$VAR_DOMAIN_NAME" ]          && missing+=("VARIABLE DOMAIN_NAME")
          [ -z "$VAR_AWS_REGION_PRIMARY" ]   && missing+=("VARIABLE AWS_REGION_PRIMARY")
          [ -z "$VAR_AWS_REGION_SECONDARY" ] && missing+=("VARIABLE AWS_REGION_SECONDARY")
          [ -z "$VAR_HOSTED_ZONE_ID" ]       && missing+=("VARIABLE HOSTED_ZONE_ID")
          [ -z "$AWS_ACCESS_KEY_ID" ]        && missing+=("SECRET AWS_ACCESS_KEY_ID")
          [ -z "$AWS_SECRET_ACCESS_KEY" ]    && missing+=("SECRET AWS_SECRET_ACCESS_KEY")
          [ -z "$DATABASE_PASSWORD" ]        && missing+=("SECRET DATABASE_PASSWORD")
          [ -z "$GOOGLE_CLIENT_ID" ]         && missing+=("SECRET GOOGLE_CLIENT_ID")
          [ -z "$GOOGLE_CLIENT_SECRET" ]     && missing+=("SECRET GOOGLE_CLIENT_SECRET")
          [ -z "$FRAMEWORK_FEED_TOKEN" ]     && missing+=("SECRET FRAMEWORK_FEED_TOKEN (read:packages PAT for the framework feed)")

          # Optional config — warn, do not fail.
          for o in AWS_ACCESS_KEY_ID_PROD AWS_SECRET_ACCESS_KEY_PROD GOOGLE_TEST_ACCESS_TOKEN GOOGLE_TEST_REFRESH_TOKEN; do
            [ -z "${!o}" ] && echo "::warning::Optional secret $o is not set (needed for prod-branch deploys / authenticated UI tests)."
          done

          if [ ${#missing[@]} -gt 0 ]; then
            {
              echo "## ❌ Missing required configuration"
              echo ""
              echo "Set these in **Settings → Secrets and variables → Actions** (Variables / Secrets tabs), then re-run:"
              echo ""
              for m in "${missing[@]}"; do echo "- \`$m\`"; done
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ERROR: missing required configuration — see the run summary:" >&2
            for m in "${missing[@]}"; do echo "  - $m" >&2; done
            exit 1
          fi
          echo "✅ All required variables and secrets are set."

  build-sample:
    name: Build & Test Sample
    runs-on: ubuntu-latest
    needs: [get-branch-name, validate-config]
    if: needs.get-branch-name.outputs.enabled == 'true'
    permissions:
      contents: read
      packages: read
    outputs:
      custom-version: ${{ steps.version.outputs.custom-version }}
    env:
      # Restores the framework packages (Tjb.Web.Framework / Hosting / Framework.Data) from
      # GitHub Packages; src/sample/nuget.config expands %GH_PACKAGES_TOKEN%. A cross-org fork
      # sets FRAMEWORK_FEED_TOKEN (read:packages PAT on the framework's org); same-org TaskManager
      # falls back to the workflow GITHUB_TOKEN.
      GH_PACKAGES_TOKEN: ${{ secrets.FRAMEWORK_FEED_TOKEN || secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - id: version
        run: echo "custom-version=1.0.${{ github.run_number }}" >> "$GITHUB_OUTPUT"
      - name: Restore + build + test Sample.sln
        run: |
          dotnet restore src/sample/Sample.sln
          dotnet build src/sample/Sample.sln -c Release --no-restore
          # No unit-test project in the sample today; UI tests run post-deploy via deploy.yml.

  deploy:
    name: Deploy Sample to AWS
    needs: [build-sample, get-branch-name, validate-config]
    if: needs.get-branch-name.outputs.enabled == 'true'
    uses: ./.github/workflows/deploy.yml
    with:
      branch-name: ${{ needs.get-branch-name.outputs.branch-name }}
      environment: ${{ needs.get-branch-name.outputs.environment }}
      custom-version: ${{ needs.build-sample.outputs.custom-version }}
      domain-name: sample.appcloud.systems
      hosted-zone-id: ${{ vars.HOSTED_ZONE_ID }}
      region-primary: ${{ vars.AWS_REGION_PRIMARY }}
      region-secondary: ${{ vars.AWS_REGION_SECONDARY }}
      web-dockerfile-path: src/sample/Sample.Web/Dockerfile
      web-image-name: sample-web
      ui-tests-project-path: src/sample/Sample.UiTests
    secrets: inherit
