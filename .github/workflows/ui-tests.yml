name: UI Tests

on:
  push:
    branches: [ main, dev, app, beta, alpha ]
    paths:
      - 'src/TaskManager.Web2/**'
      - 'src/TaskManager.UiTests/**'
      - '.github/workflows/ui-tests.yml'
  pull_request:
    branches: [ main, dev ]
    paths:
      - 'src/TaskManager.Web2/**'
      - 'src/TaskManager.UiTests/**'
      - '.github/workflows/ui-tests.yml'
  workflow_dispatch: # Allow manual triggering

jobs:
  ui-tests:
    name: Run UI Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-uitests-${{ hashFiles('**/TaskManager.UiTests.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-uitests-

    - name: Restore dependencies
      run: dotnet restore src/TaskManager.UiTests/TaskManager.UiTests.csproj

    - name: Build UI Tests
      run: dotnet build src/TaskManager.UiTests/TaskManager.UiTests.csproj --configuration Release --no-restore

    - name: Install Playwright browsers
      run: |
        cd src/TaskManager.UiTests
        dotnet build
      shell: bash

    - name: Run UI Tests
      run: |
        echo "Running UI tests against deployed environment..."
        echo "Current working directory: $(pwd)"
        echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
        cd src/TaskManager.UiTests
        echo "Changed to: $(pwd)"
        dotnet test --verbosity normal --configuration Release --logger "trx;LogFileName=test-results.trx"

    - name: List generated files for debugging
      if: always()
      run: |
        echo "Current working directory: $(pwd)"
        echo "GITHUB_WORKSPACE: $GITHUB_WORKSPACE"
        echo "Listing TestResults directory:"
        find . -name "TestResults" -type d
        find . -name "*.png" -type f | head -20
        echo "Listing src/TaskManager.UiTests/TestResults:"
        ls -la src/TaskManager.UiTests/TestResults/ 2>/dev/null || echo "Directory not found"
        ls -la src/TaskManager.UiTests/TestResults/Screenshots/ 2>/dev/null || echo "Screenshots directory not found"

    - name: Upload test results
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ui-test-results
        path: |
          src/TaskManager.UiTests/TestResults/**/*.png
          src/TaskManager.UiTests/TestResults/**/*.json
          src/TaskManager.UiTests/TestResults/**/*.txt
          **/*.trx
        retention-days: 7

    - name: Upload detailed test report
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: ui-test-detailed-report
        path: |
          src/TaskManager.UiTests/TestResults/ui-test-report-*.json
          src/TaskManager.UiTests/TestResults/test-summary.txt
        retention-days: 7

    - name: Display test summary
      if: always()
      run: |
        echo "=== UI Test Summary ==="
        if [ -f "src/TaskManager.UiTests/TestResults/test-summary.txt" ]; then
          cat src/TaskManager.UiTests/TestResults/test-summary.txt
        else
          echo "No test summary found"
        fi

    - name: Publish test results to workflow dashboard
      uses: EnricoMi/publish-unit-test-result-action@v2
      if: always()
      with:
        files: '**/*.trx'

    - name: Comment PR with results
      uses: dorny/test-reporter@v1
      if: github.event_name == 'pull_request'
      with:
        name: UI Test Results
        path: '**/*.trx'
        reporter: dotnet-trx
        fail-on-error: true