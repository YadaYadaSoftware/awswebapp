name: Deploy Everything
on:
  push:
    branches:
      - '**'
    paths-ignore:
      - '.vscode/**'
      - 'scripts/**'
      - '**/*.md'
      - 'openspec/**/*.yaml'
    tags-ignore:
      - '**'
  pull_request:
    paths-ignore:
      - '.vscode/**'
      - 'scripts/**'
      - '**/*.md'

# Per-branch run cancellation: a new push to any non-`app` branch cancels the
# in-flight run for that branch (build/test/deploy/UI tests all stop). `app`
# preserves queue-behavior so production deploys are never interrupted mid-flight.
concurrency:
  group: workflow-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/app' }}

env:
  # Region values sourced from repo Variables (Settings -> Secrets and variables
  # -> Actions -> Variables). Set AWS_REGION_PRIMARY and AWS_REGION_SECONDARY
  # there; this workflow has no fallback so an unset variable will fail the run.
  AWS_REGION_SECONDARY: ${{ vars.AWS_REGION_SECONDARY }}
  AWS_REGION_PRIMARY: ${{ vars.AWS_REGION_PRIMARY }}
  ENGINE_VERSION: 8.0.mysql_aurora.3.10.0
  # OAuth Testing Configuration
  USE_MOCKED_OAUTH: false
  USE_TOKEN_BASED_AUTH: true
  ENABLE_OAUTH_TESTING: true

jobs:
  get-branch-name:
    name: Get Branch Name
    runs-on: ubuntu-latest
    outputs:
      branch-name: ${{ steps.get-branch.outputs.branch-name }}
      environment: ${{ steps.get-branch.outputs.environment }}
      nodeploy: ${{ steps.check-commit.outputs.nodeploy }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get branch name
      id: get-branch
      run: |
        FULL_BRANCH_NAME=${GITHUB_REF#refs/heads/}
        # Extract only the last part after "/" (e.g., "system/xyz" becomes "xyz")
        BRANCH_NAME=${FULL_BRANCH_NAME##*/}
        echo "Original branch: $FULL_BRANCH_NAME"
        echo "Stack name branch: $BRANCH_NAME"

        # Determine Environment based on branch name
        if [ "$BRANCH_NAME" = "app" ]; then
          ENVIRONMENT="Production"
        elif [[ "$BRANCH_NAME" = "beta" || "$BRANCH_NAME" = "alpha" ]]; then
          ENVIRONMENT="Staging"
        else
          ENVIRONMENT="Development"
        fi

        echo "Environment: $ENVIRONMENT"
        echo "branch-name=$BRANCH_NAME" >> $GITHUB_OUTPUT
        echo "environment=$ENVIRONMENT" >> $GITHUB_OUTPUT

    - name: Check commit message for nodeploy
      id: check-commit
      run: |
        # Check up to 5 commits back, skipping merge commits
        NODEPLOY_FOUND=false

        for i in {0..4}; do
          COMMIT_MESSAGE=$(git log --skip=$i -1 --pretty=%B)
          echo "Checking commit $((i+1)): $(echo "$COMMIT_MESSAGE" | head -1)"

          if echo "$COMMIT_MESSAGE" | grep -qi "merge branch"; then
            echo "Skipping merge commit"
            continue
          else
            # Found a non-merge commit, check for nodeploy
            if echo "$COMMIT_MESSAGE" | grep -qi "nodeploy"; then
              NODEPLOY_FOUND=true
            fi
            break
          fi
        done

        if [ "$NODEPLOY_FOUND" = true ]; then
          echo "🚫 Found 'nodeploy' in non-merge commit message - skipping deployment"
          echo "nodeploy=true" >> $GITHUB_OUTPUT
        else
          echo "✅ No 'nodeploy' found in recent non-merge commits - proceeding with deployment"
          echo "nodeploy=false" >> $GITHUB_OUTPUT
        fi

  build:
    name: Build and Test Applications
    runs-on: ubuntu-latest
    needs: [get-branch-name]
    permissions:
      contents: read
      checks: write
    outputs:
      semVer: ${{ steps.gitversion.outputs.semVer }}
      customVersion: ${{ steps.custom-version.outputs.custom-version }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Validate changes folder is empty
      if: contains(fromJson('["dev", "alpha", "beta", "app"]'), needs.get-branch-name.outputs.branch-name)
      run: |
        echo "🔍 Checking for leftover changes files in changes/ folder..."

        # Check if changes folder exists and has files
        if [ -d "changes" ] && [ "$(ls -A changes/ 2>/dev/null)" ]; then
          echo "❌ Build failed: Found leftover files in changes/ folder:" >&2
          ls -la changes/ >&2
          echo "" >&2
          echo "💡 To fix this issue:" >&2
          echo "   1. Run the merge-to-dev script to merge pending changes" >&2
          echo "   2. Or manually delete the files in the changes/ folder" >&2
          echo "   3. Then push your changes to trigger a new build" >&2
          exit 1
        else
          echo "✅ No leftover changes files found"
        fi
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Setup GitVersion
      uses: gittools/actions/gitversion/setup@v0
      with:
        versionSpec: '5.x'

    - name: Unshallow repository if needed
      run: |
        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          echo "Repository is shallow, unshallowing..."
          git fetch --unshallow
        else
          echo "Repository is not shallow"
        fi

    - name: Determine Version
      id: gitversion
      uses: gittools/actions/gitversion/execute@v0
      with:
        useConfigFile: true

    - name: Set Custom Version
      id: custom-version
      run: |
        MAJOR=${{ steps.gitversion.outputs.major }}
        MINOR=${{ steps.gitversion.outputs.minor }}
        PATCH=${{ steps.gitversion.outputs.patch }}
        BUILD=${{ steps.gitversion.outputs.buildMetaData }}
        CUSTOM_VERSION="$MAJOR.$MINOR.$PATCH.$BUILD"
        echo "custom-version=$CUSTOM_VERSION"
        echo "custom-version=$CUSTOM_VERSION" >> $GITHUB_OUTPUT
        echo "Using custom version: $CUSTOM_VERSION"

    - name: Cache NuGet packages
      uses: actions/cache@v4
      with:
        path: ~/.nuget/packages
        key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
        restore-keys: |
          ${{ runner.os }}-nuget-

    - name: Restore dependencies
      run: dotnet restore

    - name: Build
      run: |
        echo "Building with version: ${{ steps.custom-version.outputs.custom-version }}"
        dotnet build --no-restore --configuration Release /p:Version=${{ steps.custom-version.outputs.custom-version }} /p:AssemblyVersion=${{ steps.gitversion.outputs.assemblySemVer }} /p:FileVersion=${{ steps.gitversion.outputs.assemblySemVer }}

    - name: Run Unit Tests (excluding UI tests)
      run: |
        echo "Running unit tests for all projects except UI tests..."
        # Run tests for all test projects except UiTests
        dotnet test --configuration Release --filter "FullyQualifiedName!~Tjb.UiTests" --logger "trx;LogFileName=unit-tests.trx" --results-directory ./TestResults 2>&1 | tee test-output.log || true

        # Check if any tests were found and run
        if grep -q "Test run summary:" test-output.log; then
          echo "Unit tests completed"
        else
          echo "No unit tests found (excluding UI tests)"
        fi

    - name: Report unit test results
      if: always()
      uses: dorny/test-reporter@v1
      with:
        name: Unit tests
        path: '**/TestResults/unit-tests.trx'
        reporter: dotnet-trx
        fail-on-error: false

    - name: Generate Unit Test Summary (fallback)
      if: always()
      run: |
        # Defensive fallback: if dorny produced no summary (e.g. no TRX because the
        # solution currently has no unit-test project), still leave a note on the run.
        TRX=$(find . -name unit-tests.trx -print -quit 2>/dev/null)
        if [ -z "$TRX" ]; then
          echo "## Unit tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "No unit-test TRX produced — the solution has no unit-test project today; UI tests run post-deploy." >> $GITHUB_STEP_SUMMARY
        fi

    - name: Upload Unit Test Results
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: unit-test-results-${{ github.run_id }}
        path: |
          **/TestResults/*.trx
        retention-days: ${{ needs.get-branch-name.outputs.branch-name == 'app' && 30 || 7 }}
        if-no-files-found: ignore

    - name: Pack Tjb.Shared
      run: |
        BRANCH_NAME="${{ needs.get-branch-name.outputs.branch-name }}"
        VERSION="${{ steps.custom-version.outputs.custom-version }}"

        # Sanitize branch name for package ID (replace special chars with hyphens)
        SANITIZED_BRANCH=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9]/-/g')

        if [ "$BRANCH_NAME" != "app" ]; then
          NUGET_VERSION="$VERSION-$SANITIZED_BRANCH"
        else
          NUGET_VERSION=$VERSION

        fi


        dotnet pack src/Tjb.Shared/Tjb.Shared.csproj \
          --configuration Release \
          --output ./nupkgs \
          --version "$VERSION" \
          --include-symbols \
          --include-source \
          -p:PackageVersion=$NUGET_VERSION
    - name: Pack Tjb.Data
      run: |
        BRANCH_NAME="${{ needs.get-branch-name.outputs.branch-name }}"
        VERSION="${{ steps.custom-version.outputs.custom-version }}"

        # Sanitize branch name for package ID (replace special chars with hyphens)
        SANITIZED_BRANCH=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9]/-/g')

        if [ "$BRANCH_NAME" != "app" ]; then
          NUGET_VERSION="$VERSION-$SANITIZED_BRANCH"
        else
          NUGET_VERSION=$VERSION
        fi

        dotnet pack src/Tjb.Data/Tjb.Data.csproj \
          --configuration Release \
          --output ./nupkgs \
          --version "$VERSION" \
          --include-symbols \
          --include-source \
          -p:PackageVersion=$NUGET_VERSION

    - name: Pack Tjb.Api
      run: |
        BRANCH_NAME="${{ needs.get-branch-name.outputs.branch-name }}"
        VERSION="${{ steps.custom-version.outputs.custom-version }}"

        # Sanitize branch name for package ID (replace special chars with hyphens)
        SANITIZED_BRANCH=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9]/-/g')

        if [ "$BRANCH_NAME" != "app" ]; then
          NUGET_VERSION="$VERSION-$SANITIZED_BRANCH"
        else
          NUGET_VERSION=$VERSION
        fi

        dotnet pack src/Tjb.Api/Tjb.Api.csproj \
          --configuration Release \
          --output ./nupkgs \
          --version "$VERSION" \
          --include-symbols \
          --include-source \
          -p:PackageVersion=$NUGET_VERSION

    - name: Pack Tjb.Migrations
      run: |
        BRANCH_NAME="${{ needs.get-branch-name.outputs.branch-name }}"
        VERSION="${{ steps.custom-version.outputs.custom-version }}"

        # Sanitize branch name for package ID (replace special chars with hyphens)
        SANITIZED_BRANCH=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9]/-/g')

        if [ "$BRANCH_NAME" != "app" ]; then
          NUGET_VERSION="$VERSION-$SANITIZED_BRANCH"
        else
          NUGET_VERSION=$VERSION
        fi

        dotnet pack src/Tjb.Migrations/Tjb.Migrations.csproj \
          --configuration Release \
          --output ./nupkgs \
          --version "$VERSION" \
          --include-symbols \
          --include-source \
          -p:PackageVersion=$NUGET_VERSION

    - name: Pack Tjb.Web
      run: |
        BRANCH_NAME="${{ needs.get-branch-name.outputs.branch-name }}"
        VERSION="${{ steps.custom-version.outputs.custom-version }}"

        # Sanitize branch name for package ID (replace special chars with hyphens)
        SANITIZED_BRANCH=$(echo "$BRANCH_NAME" | sed 's/[^a-zA-Z0-9]/-/g')

        if [ "$BRANCH_NAME" != "app" ]; then
          NUGET_VERSION="$VERSION-$SANITIZED_BRANCH"
        else
          NUGET_VERSION=$VERSION
        fi

        dotnet pack src/Tjb.Web/Tjb.Web.csproj \
          --configuration Release \
          --output ./nupkgs \
          --version "$VERSION" \
          --include-symbols \
          --include-source \
          -p:PackageVersion=$NUGET_VERSION

    - name: Upload NuGet packages
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: ./nupkgs/*.nupkg

    - name: Publish Web for Container
      run: |
        echo "Publishing Web with version: ${{ steps.custom-version.outputs.custom-version }}"
        dotnet publish src/Tjb.Web/Tjb.Web.csproj --configuration Release --output ./publish/web --runtime linux-x64 --self-contained false /p:Version=${{ steps.custom-version.outputs.custom-version }} /p:AssemblyVersion=${{ steps.gitversion.outputs.assemblySemVer }}



    - name: Create MySQL Lambda Layer
      run: |
        # Create layer directory structure
        mkdir -p python/lib/python3.9/site-packages

        # Install PyMySQL (pure Python MySQL driver)
        pip install PyMySQL -t python/lib/python3.9/site-packages/

        # Create layer ZIP file
        zip -r mysql-layer.zip python/

        echo "MySQL layer created successfully"

    - name: Upload MySQL Layer
      uses: actions/upload-artifact@v4
      with:
        name: mysql-layer-package
        path: mysql-layer.zip
  deploy:
    name: Deploy to AWS
    runs-on: ubuntu-latest
    needs: [build, get-branch-name]
    if: needs.get-branch-name.outputs.nodeploy != 'true'
    concurrency:
      group: deploy-${{ matrix.region }}-${{ needs.get-branch-name.outputs.branch-name }}
      cancel-in-progress: false
    strategy:
      matrix:
        include:
          - region: ${{ vars.AWS_REGION_PRIMARY }}
            is_primary: "true"
            deploy: true
          - region: ${{ vars.AWS_REGION_SECONDARY }}
            is_primary: "false"
            deploy: ${{ contains(fromJson('["app","beta","alpha"]'), needs.get-branch-name.outputs.branch-name) }}
      max-parallel: 1
    steps:
    - name: Check deployment status
      run: |
        if [ "${{ needs.get-branch-name.outputs.nodeploy }}" = "true" ]; then
          echo "🚫 Deployment skipped due to 'nodeploy' in commit message"
          echo "Commit message contained 'nodeploy' - no deployment will occur"
        else
          echo "✅ Proceeding with deployment"
        fi

    - name: Checkout code
      if: matrix.deploy
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Calculate Source Checksum
      if: matrix.deploy
      id: checksum
      run: |
        # Calculate SHA256 checksum of all files in src/ directory
        SRC_CHECKSUM=$(find src -type f -exec sha256sum {} \; | sort | sha256sum | cut -d' ' -f1)
        echo "📋 Source checksum: $SRC_CHECKSUM"
        echo "src-checksum=$SRC_CHECKSUM" >> $GITHUB_OUTPUT

    - name: Install SAM CLI
      if: matrix.deploy
      run: |
        pip install aws-sam-cli

    - name: Select AWS credentials by branch
      if: matrix.deploy
      id: select-creds
      env:
        BRANCH_NAME: ${{ needs.get-branch-name.outputs.branch-name }}
        AWS_AK_PROD: ${{ secrets.AWS_ACCESS_KEY_ID_PROD }}
        AWS_SK_PROD: ${{ secrets.AWS_SECRET_ACCESS_KEY_PROD }}
        AWS_AK_NONPROD: ${{ secrets.AWS_ACCESS_KEY_ID }}
        AWS_SK_NONPROD: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      run: |
        # The 'app' branch is the only one that gets prod credentials.
        # Every other branch uses the non-prod (default) credentials sourced
        # from the bootstrap stack's nonprod GitHubActionsUser.
        if [ "$BRANCH_NAME" = "app" ]; then
          if [ -z "$AWS_AK_PROD" ] || [ -z "$AWS_SK_PROD" ]; then
            echo "ERROR: app-branch deploy requires AWS_ACCESS_KEY_ID_PROD and AWS_SECRET_ACCESS_KEY_PROD GitHub secrets to be set (sourced from the bootstrap stack's GitHubActionsUserProd outputs)." >&2
            exit 1
          fi
          echo "access-key-id=$AWS_AK_PROD" >> $GITHUB_OUTPUT
          echo "secret-access-key=$AWS_SK_PROD" >> $GITHUB_OUTPUT
          echo "Using PROD credentials for app branch"
        else
          echo "access-key-id=$AWS_AK_NONPROD" >> $GITHUB_OUTPUT
          echo "secret-access-key=$AWS_SK_NONPROD" >> $GITHUB_OUTPUT
          echo "Using NONPROD credentials for branch: $BRANCH_NAME"
        fi

    - name: Configure AWS credentials
      if: matrix.deploy
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ steps.select-creds.outputs.access-key-id }}
        aws-secret-access-key: ${{ steps.select-creds.outputs.secret-access-key }}
        aws-region: ${{ matrix.region }}

    - name: Get AWS Account ID
      if: matrix.deploy
      id: account-id
      run: |
        ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
        echo "AWS Account ID: $ACCOUNT_ID"
        echo "account-id=$ACCOUNT_ID" >> $GITHUB_OUTPUT

    - name: Process Domain Name
      if: matrix.deploy
      id: process-domain
      run: |
        # Get domain name from secrets and process it (replace dots with hyphens)
        RAW_DOMAIN="${{ secrets.DOMAIN_NAME }}"
        PROCESSED_DOMAIN=$(echo $RAW_DOMAIN | tr '.' '-')
        echo "Original domain: $RAW_DOMAIN"
        echo "Processed domain: $PROCESSED_DOMAIN"
        echo "processed-domain=$PROCESSED_DOMAIN" >> $GITHUB_OUTPUT


    - name: Build and package template
      if: matrix.deploy
      run: |
        BUCKET_NAME="${{ steps.account-id.outputs.account-id }}-${{ steps.process-domain.outputs.processed-domain }}-${{ matrix.region }}"
        BRANCH_NAME="${{ needs.get-branch-name.outputs.branch-name }}"
        ENVIRONMENT="${{ needs.get-branch-name.outputs.environment }}"
        echo "BUCKET_NAME=$BUCKET_NAME" >> $GITHUB_ENV

        # Choose template based on branch name
        # Deploy master template for shared infrastructure branches
        if [[ " app beta alpha dev " == *" $BRANCH_NAME "* ]]; then
          TEMPLATE_FILE="infrastructure/master.template"
          TEMPLATE_NAME="master"
          echo "Using master template for shared infrastructure branch: $BRANCH_NAME"
        else
          TEMPLATE_FILE="infrastructure/application.template"
          TEMPLATE_NAME="application"
          echo "Using application template for feature branch: $BRANCH_NAME"
        fi

        echo "TEMPLATE_FILE=$TEMPLATE_FILE" >> $GITHUB_ENV
        echo "TEMPLATE_NAME=$TEMPLATE_NAME" >> $GITHUB_ENV

        echo "Building and packaging $TEMPLATE_NAME template to S3 bucket: $BUCKET_NAME"
        sam build --template $TEMPLATE_FILE --region ${{ matrix.region }}
        sam package --template-file .aws-sam/build/template.yaml --s3-bucket $BUCKET_NAME --s3-prefix $BRANCH_NAME --output-template-file packaged-${TEMPLATE_NAME}-template.yaml --region ${{ matrix.region }}

        # Upload the packaged template with appropriate name
        aws s3 cp packaged-${TEMPLATE_NAME}-template.yaml s3://$BUCKET_NAME/$BRANCH_NAME/${TEMPLATE_NAME}-template.yaml --region ${{ matrix.region }}
        TEMPLATE_VERSION_ID=$(aws s3api head-object --bucket $BUCKET_NAME --key $BRANCH_NAME/${TEMPLATE_NAME}-template.yaml --query VersionId --output text)
        echo "TEMPLATE_VERSION_ID=$TEMPLATE_VERSION_ID" >> $GITHUB_ENV

    - name: Check if Web Container Image Exists
      id: check-image
      if: matrix.deploy
      run: |
        SRC_CHECKSUM=${{ steps.checksum.outputs.src-checksum }}
        BRANCH_NAME=${{ needs.get-branch-name.outputs.branch-name }}
        SEMVER_TAG=${{ needs.build.outputs.customVersion }}

        # Construct ECR repository URI
        ACCOUNT_ID=${{ steps.account-id.outputs.account-id }}
        ECR_REPO="${ACCOUNT_ID}.dkr.ecr.${{ matrix.region }}.amazonaws.com/${{ steps.process-domain.outputs.processed-domain }}"

        echo "🎯 ECR repository: $ECR_REPO"
        echo "📋 Checksum tag: $SRC_CHECKSUM"
        echo "🏷️ SemVer tag: $SEMVER_TAG"

        # Check if image with checksum tag already exists
        if aws ecr describe-images --repository-name ${{ steps.process-domain.outputs.processed-domain }} --image-ids imageTag=$SRC_CHECKSUM --region ${{ matrix.region }} >/dev/null 2>&1; then
          echo "✅ Image $ECR_REPO:$SRC_CHECKSUM already exists, reusing"
          echo "image-exists=true" >> $GITHUB_OUTPUT
        else
          echo "❌ Image $ECR_REPO:$SRC_CHECKSUM does not exist, will build"
          echo "image-exists=false" >> $GITHUB_OUTPUT
        fi

    - name: Build and Push Web Container Image
      if: matrix.deploy && steps.check-image.outputs.image-exists == 'false'
      run: |
        SRC_CHECKSUM=${{ steps.checksum.outputs.src-checksum }}
        BRANCH_NAME=${{ needs.get-branch-name.outputs.branch-name }}
        SEMVER_TAG=${{ needs.build.outputs.customVersion }}
        BRANCH_TAG=${BRANCH_NAME:-main}

        # Construct ECR repository URI
        ACCOUNT_ID=${{ steps.account-id.outputs.account-id }}
        ECR_REPO="${ACCOUNT_ID}.dkr.ecr.${{ matrix.region }}.amazonaws.com/${{ steps.process-domain.outputs.processed-domain }}"

        echo "🎯 ECR repository: $ECR_REPO"
        echo "📋 Checksum tag: $SRC_CHECKSUM"
        echo "🏷️ SemVer tag: $SEMVER_TAG"
        echo "🌿 Branch tag: $BRANCH_TAG"

        # Build container image from root context
        docker build -t tjb-web:$SRC_CHECKSUM -f src/Tjb.Web/Dockerfile . --build-arg VERSION=${{ needs.build.outputs.customVersion }} --build-arg ASSEMBLY_VERSION=${{ needs.build.outputs.assemblySemVer }}

        # Login to ECR
        aws ecr get-login-password --region ${{ matrix.region }} | docker login --username AWS --password-stdin $ECR_REPO

        # Tag and push checksum-tagged image
        docker tag tjb-web:$SRC_CHECKSUM $ECR_REPO:$SRC_CHECKSUM
        docker push $ECR_REPO:$SRC_CHECKSUM
        echo "✅ Pushed checksum image: $ECR_REPO:$SRC_CHECKSUM"

        # Also tag and push with SemVer for reference
        docker tag tjb-web:$SRC_CHECKSUM $ECR_REPO:$SEMVER_TAG
        docker push $ECR_REPO:$SEMVER_TAG
        echo "✅ Pushed SemVer image: $ECR_REPO:$SEMVER_TAG"

        # Tag and push branch-specific image (for easy reference)
        docker tag tjb-web:$SRC_CHECKSUM $ECR_REPO:$BRANCH_TAG
        docker push $ECR_REPO:$BRANCH_TAG
        echo "✅ Pushed branch image: $ECR_REPO:$BRANCH_TAG"

        # Also tag as latest for main branch
        if [ "$BRANCH_NAME" = "main" ]; then
          docker tag tjb-web:$SRC_CHECKSUM $ECR_REPO:latest
          docker push $ECR_REPO:latest
          echo "✅ Pushed latest image: $ECR_REPO:latest"
        fi

    - name: Set Container Image Variable
      if: matrix.deploy
      run: |
        SRC_CHECKSUM=${{ steps.checksum.outputs.src-checksum }}
        ACCOUNT_ID=${{ steps.account-id.outputs.account-id }}
        ECR_REPO="${ACCOUNT_ID}.dkr.ecr.${{ matrix.region }}.amazonaws.com/${{ steps.process-domain.outputs.processed-domain }}"
        CONTAINER_IMAGE=$ECR_REPO:$SRC_CHECKSUM
        echo "CONTAINER_IMAGE=$CONTAINER_IMAGE" >> $GITHUB_ENV

    - name: Lookup bootstrap KMS key from SSM
      id: bootstrap-kms
      if: matrix.deploy
      run: |
        BRANCH_NAME="${{ needs.get-branch-name.outputs.branch-name }}"
        # The 'app' branch uses the prod KMS key; every other branch (including
        # feature branches that consume dev's backend) uses the nonprod key.
        if [ "$BRANCH_NAME" = "app" ]; then
          SCOPE="prod"
        else
          SCOPE="nonprod"
        fi
        SSM_PATH="/${{ steps.process-domain.outputs.processed-domain }}/kms/${SCOPE}/aurora-key-arn"
        echo "Looking up $SSM_PATH in ${{ matrix.region }}"
        BOOTSTRAP_KMS_KEY_ARN=$(aws ssm get-parameter --name "$SSM_PATH" --region ${{ matrix.region }} --query 'Parameter.Value' --output text)
        if [ -z "$BOOTSTRAP_KMS_KEY_ARN" ] || [ "$BOOTSTRAP_KMS_KEY_ARN" = "None" ]; then
          echo "ERROR: SSM parameter $SSM_PATH in ${{ matrix.region }} is empty or missing. Deploy the bootstrap stack (named for the dashed-domain) in this region before continuing." >&2
          exit 1
        fi
        echo "BOOTSTRAP_KMS_KEY_ARN=$BOOTSTRAP_KMS_KEY_ARN" >> $GITHUB_ENV

    - name: Lookup Aurora cluster delete handler ARN from SSM
      id: bootstrap-aurora-teardown
      if: matrix.deploy
      run: |
        # Bootstrap publishes one regional teardown Lambda per region at this
        # dashed-domain-scoped path (parallel to the KMS key lookup above). The
        # value is threaded into master.template as AuroraClusterDeleteHandlerArn
        # and ends up as the AuroraClusterDrainOnDelete custom resource's
        # ServiceToken in db.template.
        SSM_PATH="/${{ steps.process-domain.outputs.processed-domain }}/lambda/aurora-cluster-delete-handler-arn"
        echo "Looking up $SSM_PATH in ${{ matrix.region }}"
        AURORA_CLUSTER_DELETE_HANDLER_ARN=$(aws ssm get-parameter --name "$SSM_PATH" --region ${{ matrix.region }} --query 'Parameter.Value' --output text)
        if [ -z "$AURORA_CLUSTER_DELETE_HANDLER_ARN" ] || [ "$AURORA_CLUSTER_DELETE_HANDLER_ARN" = "None" ]; then
          echo "ERROR: SSM parameter $SSM_PATH in ${{ matrix.region }} is empty or missing. Deploy the bootstrap stack (named for the dashed-domain) in this region before continuing." >&2
          exit 1
        fi
        echo "AURORA_CLUSTER_DELETE_HANDLER_ARN=$AURORA_CLUSTER_DELETE_HANDLER_ARN" >> $GITHUB_ENV

    - name: Get primary region outputs for secondary
      id: get-primary-outputs
      if: matrix.is_primary == 'false' && matrix.deploy
      run: |
        BRANCH_NAME="${{ needs.get-branch-name.outputs.branch-name }}"

        echo "Getting outputs from primary region stack..."
        # For feature branches, get exports from dev branch
        # For shared infrastructure branches, get from current branch
        if [[ " app beta alpha dev " == *" $BRANCH_NAME "* ]]; then
          SOURCE_BRANCH="$BRANCH_NAME"
        else
          SOURCE_BRANCH="dev"
        fi

        PRIMARY_STACK_NAME="$SOURCE_BRANCH-${{ steps.process-domain.outputs.processed-domain }}"
        echo "Source branch: $SOURCE_BRANCH"
        echo "Primary stack name: $PRIMARY_STACK_NAME"

        GLOBAL_CLUSTER_ID=$(aws cloudformation describe-stacks --stack-name $PRIMARY_STACK_NAME --region ${{ env.AWS_REGION_PRIMARY }} --query 'Stacks[0].Outputs[?OutputKey==`AuroraGlobalClusterId`].OutputValue' --output text)
        PRIMARY_LB_DNS=$(aws cloudformation describe-stacks --stack-name $PRIMARY_STACK_NAME --region ${{ env.AWS_REGION_PRIMARY }} --query 'Stacks[0].Outputs[?OutputKey==`WebLoadBalancerDNS`].OutputValue' --output text)
        PRIMARY_LB_HZ=$(aws cloudformation describe-stacks --stack-name $PRIMARY_STACK_NAME --region ${{ env.AWS_REGION_PRIMARY }} --query 'Stacks[0].Outputs[?OutputKey==`WebLoadBalancerHostedZoneId`].OutputValue' --output text)
        echo "global-cluster-id=$GLOBAL_CLUSTER_ID" >> $GITHUB_OUTPUT
        echo "primary-lb-dns=$PRIMARY_LB_DNS" >> $GITHUB_OUTPUT
        echo "primary-lb-hz=$PRIMARY_LB_HZ" >> $GITHUB_OUTPUT

    - name: Set parameter overrides
      id: set-params
      if: matrix.deploy
      run: |
        BRANCH_NAME="${{ needs.get-branch-name.outputs.branch-name }}"
        ENVIRONMENT="${{ needs.get-branch-name.outputs.environment }}"

        # Determine if this is a multi-region deployment
        # Multi-region: app, beta, alpha
        # Single-region: all other branches
        if [[ " app beta alpha " == *" $BRANCH_NAME "* ]]; then
          IS_MULTI_REGION="true"
          echo "Multi-region deployment for branch: $BRANCH_NAME"
        else
          IS_MULTI_REGION="false"
          echo "Single-region deployment for branch: $BRANCH_NAME"
        fi

        # Determine EnvironmentToImport value
        if [[ " app beta alpha dev " == *" $BRANCH_NAME "* ]]; then
          ENVIRONMENT_TO_IMPORT="$BRANCH_NAME"
        else
          ENVIRONMENT_TO_IMPORT="dev"
        fi

        # Build common BASE_PARAMS for all templates
        BASE_PARAMS="BranchName=${BRANCH_NAME}"
        BASE_PARAMS="$BASE_PARAMS,GoogleOAuthClientId=${{ secrets.GOOGLE_CLIENT_ID }}"
        BASE_PARAMS="$BASE_PARAMS,GoogleOAuthClientSecret=${{ secrets.GOOGLE_CLIENT_SECRET }}"
        BASE_PARAMS="$BASE_PARAMS,WebContainerImage=${{ env.CONTAINER_IMAGE }}"
        BASE_PARAMS="$BASE_PARAMS,DeploymentToken=${{ github.sha }}"
        BASE_PARAMS="$BASE_PARAMS,DomainName=${{ secrets.DOMAIN_NAME }}"
        BASE_PARAMS="$BASE_PARAMS,HostedZoneId=Z06422172SASV44F5Y8VA"
        BASE_PARAMS="$BASE_PARAMS,Environment=$ENVIRONMENT"
        BASE_PARAMS="$BASE_PARAMS,IsPrimaryRegion=${{ matrix.is_primary }}"
        BASE_PARAMS="$BASE_PARAMS,IsMultiRegion=$IS_MULTI_REGION"


        # Add primary region parameters if needed (for secondary region in multi-region deployment)
        if [ "${{ matrix.is_primary }}" = "false" ]; then
          BASE_PARAMS="$BASE_PARAMS,PrimaryRegion=${{ env.AWS_REGION_PRIMARY }}"
          BASE_PARAMS="$BASE_PARAMS,PrimaryWebLoadBalancerDNS=${{ steps.get-primary-outputs.outputs.primary-lb-dns }}"
          BASE_PARAMS="$BASE_PARAMS,PrimaryWebLoadBalancerHostedZoneId=${{ steps.get-primary-outputs.outputs.primary-lb-hz }}"
        fi

        # Set parameters based on branch name and template type
        if [[ " app beta alpha dev " == *" $BRANCH_NAME "* ]]; then
          # Master template parameters (includes backend infrastructure)
          if [ "$BRANCH_NAME" = "app" ]; then
            MIN_CAP=0.5
            MAX_CAP=4
          else
            MIN_CAP=0
            MAX_CAP=1
          fi
          if [[ " app beta alpha " == *" $BRANCH_NAME "* ]]; then
            ENABLE_GLOBAL=true
          else
            ENABLE_GLOBAL=false
          fi

          # Add master template specific parameters
          BASE_PARAMS="$BASE_PARAMS,DatabasePassword=${{ secrets.DATABASE_PASSWORD }}"
          BASE_PARAMS="$BASE_PARAMS,EngineVersion=${{ env.ENGINE_VERSION }}"
          BASE_PARAMS="$BASE_PARAMS,MinCapacity=$MIN_CAP"
          BASE_PARAMS="$BASE_PARAMS,MaxCapacity=$MAX_CAP"
          BASE_PARAMS="$BASE_PARAMS,EnableGlobalCluster=$ENABLE_GLOBAL"
          # Only pass AuroraGlobalClusterId when global cluster is enabled
          if [ "$ENABLE_GLOBAL" = "true" ]; then
            BASE_PARAMS="$BASE_PARAMS,AuroraGlobalClusterId=${{ steps.get-primary-outputs.outputs.global-cluster-id }}"
          fi
          BASE_PARAMS="$BASE_PARAMS,KmsKeyArn=${BOOTSTRAP_KMS_KEY_ARN}"
          BASE_PARAMS="$BASE_PARAMS,AuroraClusterDeleteHandlerArn=${AURORA_CLUSTER_DELETE_HANDLER_ARN}"

        else
          # Application template parameters (imports backend infrastructure from dev)
          BASE_PARAMS="$BASE_PARAMS,EnvironmentToImport=${ENVIRONMENT_TO_IMPORT}"
        fi

        PARAMS="$BASE_PARAMS"
        echo "params=$PARAMS" >> $GITHUB_OUTPUT

    - name: Deploy template
      id: deploy-template
      if: matrix.deploy
      uses: aws-actions/aws-cloudformation-github-deploy@v1
      with:
        name: ${{ needs.get-branch-name.outputs.branch-name }}-${{ steps.process-domain.outputs.processed-domain }}
        template: https://s3.amazonaws.com/${{ steps.account-id.outputs.account-id }}-${{ steps.process-domain.outputs.processed-domain }}-${{ matrix.region }}/${{ needs.get-branch-name.outputs.branch-name }}/${{ env.TEMPLATE_NAME }}-template.yaml?versionId=${{ env.TEMPLATE_VERSION_ID }}
        parameter-overrides: ${{ steps.set-params.outputs.params }}
        capabilities: "CAPABILITY_NAMED_IAM,CAPABILITY_AUTO_EXPAND"
        no-fail-on-empty-changeset: "1"
        timeout-in-minutes: 90
  post-deployment-ui-tests:
   name: Post-Deployment UI Tests
   runs-on: ubuntu-latest
   needs: [build, deploy, get-branch-name]
   if: needs.get-branch-name.outputs.nodeploy != 'true'
   permissions:
     contents: read
     checks: write

   steps:
   - name: Checkout code
     uses: actions/checkout@v4
     with:
       fetch-depth: 0

   - name: Setup .NET
     uses: actions/setup-dotnet@v4
     with:
       dotnet-version: 10.0.x

   - name: Cache NuGet packages
     uses: actions/cache@v4
     with:
       path: ~/.nuget/packages
       key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
       restore-keys: |
         ${{ runner.os }}-nuget-

   - name: Restore dependencies
     run: dotnet restore

   - name: Install Playwright Browsers
     run: |
       cd src/Tjb.UiTests
       dotnet build
       pwsh -Command "& {dotnet tool install --global Microsoft.Playwright.CLI; playwright install --with-deps chromium}"
   - name: Calculate Application URL
     id: calc-app-url
     run: |
       BRANCH_NAME="${{ needs.get-branch-name.outputs.branch-name }}"
       DOMAIN_NAME="${{ secrets.DOMAIN_NAME }}"
       APP_URL="https://${BRANCH_NAME}.${DOMAIN_NAME}"
       echo "Calculated application URL: $APP_URL"
       echo "app-url=$APP_URL" >> $GITHUB_OUTPUT
   - name: Run UI Tests Against Deployed Application
     id: ui-tests
     continue-on-error: true
     env:
       # Token-based authentication for reliable UI testing
       GOOGLE_TEST_ACCESS_TOKEN: ${{ secrets.GOOGLE_TEST_ACCESS_TOKEN }}
       GOOGLE_TEST_REFRESH_TOKEN: ${{ secrets.GOOGLE_TEST_REFRESH_TOKEN }}
       GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
       GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
       USE_TOKEN_BASED_AUTH: true
       ENABLE_OAUTH_TESTING: true
       USE_MOCKED_OAUTH: false
       # Override the base URL to point to deployed application
       TEST_BASE_URL: ${{ steps.calc-app-url.outputs.app-url }}
     run: |
       cd src/Tjb.UiTests

       # Set the base URL for tests if provided
       if [ ! -z $TEST_BASE_URL ]; then
         echo "Running UI tests against deployed application: $TEST_BASE_URL"
       else
         echo "Warning: No application URL available, UI tests may fail"
       fi

       echo "Running UI tests with token-based authentication..."
       echo "Environment: USE_TOKEN_BASED_AUTH=$USE_TOKEN_BASED_AUTH, ENABLE_OAUTH_TESTING=$ENABLE_OAUTH_TESTING"
       dotnet test --configuration Release --logger "trx;LogFileName=ui-tests.trx" --results-directory ./TestResults 2>&1 | tee test-output.log

       # Capture the exit code
       TEST_EXIT_CODE=${PIPESTATUS[0]}

       # Parse test results from the output
       if [ -f "./test-output.log" ]; then
         echo "Parsing test results from output..."

         # Show last few lines of output for debugging
         echo "Last 10 lines of test output:"
         tail -10 ./test-output.log

         # Try multiple patterns to find test results
         # Pattern 1: Standard xUnit output (e.g., "Failed: 0, Passed: 1, Skipped: 0, Total: 1")
         SUMMARY_LINE=$(grep -E "Failed: [0-9]+, Passed: [0-9]+, Skipped: [0-9]+, Total: [0-9]+" ./test-output.log | tail -1)

         # Pattern 2: Alternative format with different spacing
         if [ -z "$SUMMARY_LINE" ]; then
           SUMMARY_LINE=$(grep -E "Failed:[[:space:]]*[0-9]+.*Passed:[[:space:]]*[0-9]+.*Total:[[:space:]]*[0-9]+" ./test-output.log | tail -1)
         fi

         # Pattern 3: Look for any line with test counts
         if [ -z "$SUMMARY_LINE" ]; then
           SUMMARY_LINE=$(grep -E "[0-9]+ passed.*[0-9]+ failed" ./test-output.log | tail -1)
         fi

         if [ ! -z "$SUMMARY_LINE" ]; then
           echo "Found summary line: $SUMMARY_LINE"

           # Extract numbers using improved regex that handles different formats
           FAILED_TESTS=$(echo "$SUMMARY_LINE" | grep -oE 'Failed:[[:space:]]*([0-9]+)' | grep -oE '[0-9]+')
           PASSED_TESTS=$(echo "$SUMMARY_LINE" | grep -oE 'Passed:[[:space:]]*([0-9]+)' | grep -oE '[0-9]+')
           TOTAL_TESTS=$(echo "$SUMMARY_LINE" | grep -oE 'Total:[[:space:]]*([0-9]+)' | grep -oE '[0-9]+')

           # Fallback: try alternative patterns if standard extraction fails
           if [ -z "$FAILED_TESTS" ]; then
             FAILED_TESTS=$(echo "$SUMMARY_LINE" | grep -oE 'failed:[[:space:]]*([0-9]+)' | grep -oE '[0-9]+')
           fi
           if [ -z "$PASSED_TESTS" ]; then
             PASSED_TESTS=$(echo "$SUMMARY_LINE" | grep -oE 'passed:[[:space:]]*([0-9]+)' | grep -oE '[0-9]+')
           fi
           if [ -z "$TOTAL_TESTS" ]; then
             TOTAL_TESTS=$(echo "$SUMMARY_LINE" | grep -oE 'total:[[:space:]]*([0-9]+)' | grep -oE '[0-9]+')
           fi

           echo "Parsed results: Failed=${FAILED_TESTS:-0}, Passed=${PASSED_TESTS:-0}, Total=${TOTAL_TESTS:-0}"
           echo "failed-tests=${FAILED_TESTS:-0}" >> $GITHUB_OUTPUT
           echo "passed-tests=${PASSED_TESTS:-0}" >> $GITHUB_OUTPUT
           echo "total-tests=${TOTAL_TESTS:-0}" >> $GITHUB_OUTPUT
         else
           echo "No summary line found in test output. Available lines:"
           grep -E "(Failed|Passed|Total|failed|passed|total)" ./test-output.log | tail -5
           echo "failed-tests=0" >> $GITHUB_OUTPUT
           echo "passed-tests=0" >> $GITHUB_OUTPUT
           echo "total-tests=0" >> $GITHUB_OUTPUT
         fi
       else
         echo "No test output file found"
         echo "failed-tests=0" >> $GITHUB_OUTPUT
         echo "passed-tests=0" >> $GITHUB_OUTPUT
         echo "total-tests=0" >> $GITHUB_OUTPUT
       fi

       # Check if tests passed or failed based on exit code and results
       if [ "$TEST_EXIT_CODE" -eq 0 ] && [ "${FAILED_TESTS:-0}" -eq 0 ]; then
         echo "✅ All UI tests passed"
         echo "ui-tests-passed=true" >> $GITHUB_OUTPUT
       else
         echo "❌ Some UI tests failed"
         echo "ui-tests-passed=false" >> $GITHUB_OUTPUT
       fi

   - name: Upload UI Test Results and Screenshots
     if: always()
     uses: actions/upload-artifact@v4
     id: upload-ui-test-results
     with:
       name: ui-test-results-post-deployment
       path: |
         src/Tjb.UiTests/TestResults/
       retention-days: ${{ needs.get-branch-name.outputs.branch-name == 'app' && 30 || 7 }}
       if-no-files-found: ignore

   - name: Report UI test results
     if: always()
     uses: dorny/test-reporter@v1
     with:
       name: UI tests
       path: 'src/Tjb.UiTests/TestResults/ui-tests.trx'
       reporter: dotnet-trx
       fail-on-error: false

   - name: Upload UI test artifacts (Playwright traces/screenshots)
     if: always()
     uses: actions/upload-artifact@v4
     with:
       name: ui-test-artifacts-${{ github.run_id }}
       path: src/Tjb.UiTests/test-results/
       retention-days: ${{ needs.get-branch-name.outputs.branch-name == 'app' && 30 || 7 }}
       if-no-files-found: ignore

   - name: Summarize UI test results
     if: always()
     run: |
       # dorny/test-reporter posts its report to a CHECK RUN (the commit's Checks tab),
       # never to this Summary tab. Render a full per-test table here from the TRX so
       # the detailed results are visible on the run's Summary page as well.
       TRX="src/Tjb.UiTests/TestResults/ui-tests.trx"
       {
         echo "## UI tests"
         echo ""
         echo "✅ Passed: ${{ steps.ui-tests.outputs.passed-tests }} · ❌ Failed: ${{ steps.ui-tests.outputs.failed-tests }} · 🧪 Total: ${{ steps.ui-tests.outputs.total-tests }}"
         echo ""
       } >> "$GITHUB_STEP_SUMMARY"

       if [ -f "$TRX" ]; then
         {
           echo "| Test | Outcome | Duration |"
           echo "| --- | --- | --- |"
         } >> "$GITHUB_STEP_SUMMARY"
         # dotnet-trx writes one <UnitTestResult .../> element per line.
         grep '<UnitTestResult ' "$TRX" | while IFS= read -r line; do
           name=$(printf '%s' "$line" | grep -oP 'testName="\K[^"]+' | head -1)
           [ -z "$name" ] && continue
           outcome=$(printf '%s' "$line" | grep -oP 'outcome="\K[^"]+' | head -1)
           dur=$(printf '%s' "$line" | grep -oP 'duration="\K[^"]+' | head -1)
           case "$outcome" in
             Passed) icon="✅" ;;
             Failed) icon="❌" ;;
             *) icon="⏭" ;;
           esac
           echo "| \`$name\` | $icon ${outcome:-Unknown} | ${dur:-–} |" >> "$GITHUB_STEP_SUMMARY"
         done
         echo "" >> "$GITHUB_STEP_SUMMARY"
       else
         echo "_No \`ui-tests.trx\` was produced for this run._" >> "$GITHUB_STEP_SUMMARY"
       fi

       {
         echo "Failure messages + source-line annotations are on the **UI tests** check (dorny/test-reporter)."
         if [ -n "${{ steps.upload-ui-test-results.outputs.artifact-id }}" ]; then
           echo "Artifacts: [TRX + screenshots](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts/${{ steps.upload-ui-test-results.outputs.artifact-id }}) · Playwright traces in \`ui-test-artifacts-${{ github.run_id }}\`."
         fi
       } >> "$GITHUB_STEP_SUMMARY"

   - name: Fail workflow if UI tests failed
     if: steps.ui-tests.outputs.ui-tests-passed == 'false'
     run: |
       echo "❌ Post-deployment UI tests failed - failing the workflow"
       exit 1

  publish-nuget:
   name: Publish to GitHub Packages
   runs-on: ubuntu-latest
   needs: [build, post-deployment-ui-tests, get-branch-name]
   if: needs.get-branch-name.outputs.nodeploy != 'true'
   steps:
   - name: Download NuGet packages
     uses: actions/download-artifact@v4
     with:
       name: nuget-packages
       path: ./nupkgs

   - name: Setup .NET
     uses: actions/setup-dotnet@v4
     with:
       dotnet-version: '10.0.x'

   - name: Publish to GitHub Packages
     run: |
       dotnet nuget push "./nupkgs/*.nupkg" \
         --api-key ${{ secrets.GITHUB_TOKEN }} \
         --source https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json \
         --skip-duplicate
         