name: Update Changelog on Merge

on:
  push:
    branches:
      - dev

jobs:
  update-changelog:
    name: Update Changelog
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, 'Merge pull request')

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Get branch information
      id: branch-info
      run: |
        COMMIT_MSG="${{ github.event.head_commit.message }}"
        echo "Commit message: $COMMIT_MSG"
        if [[ "$COMMIT_MSG" =~ Merge\ pull\ request\ #[0-9]+\ from\ ([^[:space:]]+) ]]; then
          BRANCH_NAME="${BASH_REMATCH[1]}"
          echo "branch-name=$BRANCH_NAME" >> $GITHUB_OUTPUT
          echo "Extracted branch name: $BRANCH_NAME"
        else
          echo "No branch name found in commit message"
          exit 1
        fi

    - name: Get changes from changes.md
      id: get-changes
      run: |
        BRANCH_NAME="${{ steps.branch-info.outputs.branch-name }}"

        # Download the changes.md file from the feature branch
        curl -s \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          -o changes.md \
          "https://raw.githubusercontent.com/${{ github.repository }}/$BRANCH_NAME/changes.md"

        if [ -f "changes.md" ] && [ -s "changes.md" ]; then
          # Read and clean the changes.md content
          CHANGES_CONTENT=$(cat changes.md | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' | head -20)
          echo "changes-content=$CHANGES_CONTENT" >> $GITHUB_OUTPUT
          echo "Found changes.md with content length: ${#CHANGES_CONTENT}"
        else
          echo "❌ No changes.md file found in branch $BRANCH_NAME"
          echo "changes-content=" >> $GITHUB_OUTPUT
          exit 1
        fi

    - name: Validate feature branch naming
      id: validate-branch
      run: |
        BRANCH_NAME="${{ steps.branch-info.outputs.branch-name }}"
        if [[ "$BRANCH_NAME" =~ ^feature/ ]] || [[ "$BRANCH_NAME" =~ ^fix/ ]]; then
          echo "✅ Branch follows naming convention: $BRANCH_NAME"
          echo "valid=true" >> $GITHUB_OUTPUT
        else
          echo "❌ Branch does not follow naming convention: $BRANCH_NAME"
          echo "Expected pattern: feature/* or fix/*"
          echo "valid=false" >> $GITHUB_OUTPUT
        fi

    - name: Update changelog
      if: steps.validate-branch.outputs.valid == 'true'
      run: |
       BRANCH_NAME="${{ steps.branch-info.outputs.branch-name }}"
       CHANGES_CONTENT="${{ steps.get-changes.outputs.changes-content }}"
       CURRENT_DATE=$(date -u '+%Y-%m-%d')
       echo "Updating changelog for branch: $BRANCH_NAME"
       echo "Changes content: $CHANGES_CONTENT"

        # Create new changelog content
        NEW_CONTENT="# Changelog\n\nAll notable changes to this project will be documented in this file.\n\nThe format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),\nand this project adheres to [Semantic Versioning](https://semver.org/spec/v2.0.0.html).\n\n## [Unreleased]\n\n### Added\n- **$BRANCH_NAME**: $CHANGES_CONTENT ($CURRENT_DATE)\n"

        # Save existing content (excluding header if present)
        if [ -f "changelog.md" ]; then
          tail -n +2 changelog.md > temp_content.md 2>/dev/null || echo "No existing content"
        fi

        # Write new content
        echo "$NEW_CONTENT" > changelog.md

        # Append existing content
        if [ -f "temp_content.md" ]; then
          cat temp_content.md >> changelog.md
          rm temp_content.md
        fi

        echo "✅ Changelog updated successfully"

    - name: Delete changes.md from branch
      if: steps.validate-branch.outputs.valid == 'true'
      run: |
        BRANCH_NAME="${{ steps.branch-info.outputs.branch-name }}"

        # Create a commit that deletes the changes.md file
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"

        # Fetch the latest changes from the branch
        git fetch origin $BRANCH_NAME

        # Switch to the branch
        git checkout $BRANCH_NAME

        # Delete the changes.md file if it exists
        if [ -f "changes.md" ]; then
          git rm changes.md
          git commit -m "docs: remove changes.md after merge to dev"
          git push origin $BRANCH_NAME
          echo "✅ Deleted changes.md from branch $BRANCH_NAME"
        else
          echo "ℹ️ No changes.md file found to delete"
        fi

        # Switch back to dev branch
        git checkout dev

    - name: Commit and push changelog
      if: steps.validate-branch.outputs.valid == 'true'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        if git diff --quiet && git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git add changelog.md
          git commit -m "docs: update changelog for merged branch ${{ steps.branch-info.outputs.branch-name }}"
          git push
          echo "✅ Changes committed and pushed"
        fi

    - name: Fail on invalid branch naming
      if: steps.validate-branch.outputs.valid == 'false'
      run: |
        echo "Warning: Feature branch '${{ steps.branch-info.outputs.branch-name }}' does not follow the required naming convention."
        echo "Please ensure feature branches follow the pattern: 'feature/description' or 'fix/description'"
        echo "The changelog was not updated for this merge."
        exit 1