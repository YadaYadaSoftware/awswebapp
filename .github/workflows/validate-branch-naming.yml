name: Validate Branch Naming

on:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  validate-branch-name:
    name: Validate Branch Naming Convention
    runs-on: ubuntu-latest

    steps:
    - name: Get branch name
      id: branch-name
      run: |
        BRANCH_NAME="${{ github.head_ref }}"
        echo "branch-name=$BRANCH_NAME" >> $GITHUB_OUTPUT
        echo "Validating branch name: $BRANCH_NAME"

    - name: Validate branch naming convention
      run: |
        BRANCH_NAME="${{ steps.branch-name.outputs.branch-name }}"

        # Allow main, dev, app, beta branches
        if [[ "$BRANCH_NAME" =~ ^(main|dev|app|beta)$ ]]; then
          echo "✅ Branch '$BRANCH_NAME' is a protected branch, validation skipped"
          exit 0
        fi

        # Check if branch follows naming convention
        if [[ "$BRANCH_NAME" =~ ^feature/ ]] || [[ "$BRANCH_NAME" =~ ^fix/ ]]; then
          echo "✅ Branch '$BRANCH_NAME' follows naming convention"
        else
          echo "❌ Branch '$BRANCH_NAME' does not follow naming convention"
          echo ""
          echo "Branch naming convention rules:"
          echo "- Feature branches must follow pattern: 'feature/description'"
          echo "- Fix branches must follow pattern: 'fix/description'"
          echo "- Examples:"
          echo "  - ✅ feature/user-authentication"
          echo "  - ✅ fix/memory-leak-issue"
          echo "  - ❌ user-authentication"
          echo "  - ❌ bugfix"
          echo ""
          echo "Please rename your branch to follow the convention and update this PR."
          exit 1
        fi

    - name: Check for changes.md file
      run: |
        BRANCH_NAME="${{ steps.branch-name.outputs.branch-name }}"

        # Skip for protected branches
        if [[ "$BRANCH_NAME" =~ ^(main|dev|app|beta)$ ]]; then
          echo "✅ Protected branch, changes.md check skipped"
          exit 0
        fi

        # Check if changes.md exists in the branch
        curl -s \
          -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          -H "Accept: application/vnd.github.v3+json" \
          -o /dev/null \
          -w "%{http_code}" \
          "https://raw.githubusercontent.com/${{ github.repository }}/$BRANCH_NAME/changes.md" \
          | grep -q "200" || {
          echo "❌ No changes.md file found in branch '$BRANCH_NAME'"
          echo ""
          echo "Please create a changes.md file in the root of your branch that explains:"
          echo "- What the branch implements or fixes"
          echo "- Why the change is needed"
          echo "- Any important notes or breaking changes"
          echo ""
          echo "Example changes.md content:"
          echo "Add user authentication system with JWT tokens for API security"
          echo ""
          echo "This file will be automatically consumed and deleted when the branch is merged to dev."
          exit 1
        }

        echo "✅ changes.md file found in branch"