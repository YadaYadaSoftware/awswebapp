name: Publish NuGet Packages

on:
  push:
    paths:
      - 'src/TaskManager.Shared/**'
      - 'src/TaskManager.Data/**'
      - 'src/TaskManager.Web2/**'
      - '.github/workflows/nuget-publish.yml'
  pull_request:
    paths:
      - 'src/TaskManager.Shared/**'
      - 'src/TaskManager.Data/**'
      - 'src/TaskManager.Web2/**'
      - '.github/workflows/nuget-publish.yml'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Install GitVersion
      run: dotnet tool install --global GitVersion.Tool --version 5.12.0

    - name: Determine Version
      id: gitversion
      run: |
        echo "GITVERSION=$(dotnet gitversion /output json /showvariable SemVer)"
        echo "GITVERSION_NUGET=$(dotnet gitversion /output json /showvariable NuGetVersion)"
        echo "GITVERSION=$(dotnet gitversion /output json /showvariable SemVer)" >> $GITHUB_ENV
        echo "GITVERSION_NUGET=$(dotnet gitversion /output json /showvariable NuGetVersion)" >> $GITHUB_ENV

    - name: Restore dependencies
      run: dotnet restore TaskManager.sln

    - name: Build
      run: dotnet build TaskManager.sln --configuration Release --no-restore

    - name: Test
      run: dotnet test TaskManager.sln --configuration Release --no-build --verbosity normal

    - name: Pack TaskManager.Shared
      run: dotnet pack src/TaskManager.Shared/TaskManager.Shared.csproj --configuration Release --output ./nupkgs --version ${{ env.GITVERSION_NUGET }} --include-symbols --include-source

    - name: Pack TaskManager.Data
      run: dotnet pack src/TaskManager.Data/TaskManager.Data.csproj --configuration Release --output ./nupkgs --version ${{ env.GITVERSION_NUGET }} --include-symbols --include-source

    - name: Pack TaskManager.Web2
      run: dotnet pack src/TaskManager.Web2/TaskManager.Web2.csproj --configuration Release --output ./nupkgs --version ${{ env.GITVERSION_NUGET }} --include-symbols --include-source

    - name: Upload packages
      uses: actions/upload-artifact@v4
      with:
        name: nuget-packages
        path: ./nupkgs/*.nupkg

  publish:
    needs: build-and-test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    steps:
    - name: Download packages
      uses: actions/download-artifact@v4
      with:
        name: nuget-packages
        path: ./nupkgs

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Publish to NuGet
      run: |
        dotnet nuget push "./nupkgs/*.nupkg" \
          --api-key ${{ secrets.NUGET_API_KEY }} \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate